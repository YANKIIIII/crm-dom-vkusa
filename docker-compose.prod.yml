# Production-like stack: gunicorn + nginx (built SPA).
# Usage:
#   cp backend/.env.example backend/.env   # fill real secrets, set DEBUG=False
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: postgres:17
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No host port — DB stays on the internal network.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      USE_SQLITE: "False"
      DEBUG: "False"
      # Behind nginx on the same compose network; TLS terminates at the edge.
      SECURE_SSL_REDIRECT: "False"
      # Caddy → frontend nginx → gunicorn. Login throttle must use the client IP.
      NUM_PROXIES: "2"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # No host port — traffic enters via Caddy → frontend nginx.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
